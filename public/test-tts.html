<!DOCTYPE html>
<html>
<body>
<div id="logs" style="white-space: pre-wrap; font-family: monospace;"></div>
<script type="module">
const log = (msg) => {
    document.getElementById('logs').textContent += msg + '\n';
};
window.onerror = (e) => log("Global error: " + e);

async function run() {
    try {
        log("Importing...");
        const module = await import('./edge-tts-universal.js');
        log("Module imported. Keys: " + Object.keys(module).join(', '));
        const EdgeTTS = module.EdgeTTS || module.default?.EdgeTTS;
        log("EdgeTTS type: " + typeof EdgeTTS);
        
        const tts = new EdgeTTS('hello world', 'en-US-EmmaMultilingualNeural');
        log("TTS created. Calling synthesize...");
        const res = await tts.synthesize();
        log("Synthesize done. Has audio: " + !!res.audio);
        if (res.audio) {
            log("Audio size: " + res.audio.size);
        }
    } catch(e) {
        log("Error: " + e.message + "\n" + e.stack);
    }
}
run();
</script>
</body>
</html>
